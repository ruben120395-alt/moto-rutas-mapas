name: Empaquetar estilos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/estilos.py', '.github/workflows/estilos.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar estilos, fuentes e iconos
        run: python3 scripts/estilos.py
      - name: Comprimir
        run: |
          cd out/estilos && zip -q -r ../estilos.zip . && cd ../..
          ls -la out/ && unzip -l out/estilos.zip | tail -40
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mapas >/dev/null 2>&1 || gh release create mapas --title "Mapas sin conexión" --notes "Mapas de OpenStreetMap para la app Moto Rutas. © colaboradores de OpenStreetMap (ODbL)."
          gh release upload mapas out/estilos.zip --clobber
